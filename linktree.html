<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Satu tautan untuk semua hal penting tentangku">
  <title>Nama Kamu — Linktree</title>
  <style>
    :root {
      --bg-1: #0f0c29;
      --bg-2: #302b63;
      --bg-3: #24243e;
      --accent: #8e2de2;
      --accent-2: #4a00e0;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.75);
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: #679267;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ===== Bingkai HP ===== */
    .phone {
      width: 390px;
      height: min(810px, 92vh);
      min-height: 540px;
      background: #17171c;
      border-radius: 48px;
      padding: 12px;
      border: 2px solid #2e2e38;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 0 0 2px #000;
    }

    .screen {
      position: relative;
      height: 100%;
      border-radius: 36px;
      overflow: hidden;
      background: #679267;
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      position: relative;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 116px;
      height: 26px;
      background: #000;
      border-radius: 0 0 16px 16px;
    }

    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 30px;
      display: flex;
      justify-content: center;
      scrollbar-width: none;
    }

    .screen-content::-webkit-scrollbar {
      display: none;
    }

    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header */
    .profile {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 24px var(--shadow);
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      font-weight: 700;
    }

    .name {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .bio {
      margin-top: 6px;
      font-size: 0.98rem;
      color: var(--muted);
      max-width: 420px;
      line-height: 1.5;
    }

    /* Icons row */
    .socials {
      display: flex;
      gap: 14px;
      margin-top: 18px;
    }

    .socials a {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .socials a:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.18);
    }

    .socials svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    /* Link buttons */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      backdrop-filter: blur(8px);
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .link .icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .link .icon img,
    .link .icon svg {
      width: 22px;
      height: 22px;
    }

    .link .label {
      flex: 1;
    }

    .link .arrow {
      flex-shrink: 0;
      opacity: 0.6;
    }

    /* Footer */
    .footer {
      margin-top: 30px;
      font-size: 0.82rem;
      color: var(--muted);
      opacity: 0.8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* ===== Login ===== */
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 36px 28px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px var(--shadow);
      text-align: center;
    }

    .lock-icon {
      font-size: 44px;
      margin-bottom: 10px;
      display: block;
    }

    .login-card h2 {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .login-card .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 14px;
      outline: none;
      transition: border 0.15s ease;
    }

    .input-field::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .password-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .password-wrap .input-field {
      margin-bottom: 0;
      padding-right: 46px;
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px;
      opacity: 0.7;
    }

    .toggle-pass:hover {
      opacity: 1;
    }

    .error {
      display: none;
      color: #ffb3b3;
      font-size: 0.85rem;
      margin-bottom: 14px;
      background: rgba(255, 0, 0, 0.12);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--muted);
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* ===== Kartu tautan + menu titik tiga ===== */
    .link-card {
      width: 100%;
    }

    .link-row {
      position: relative;
      display: flex;
      align-items: center;
    }

    .link-row .link {
      flex: 1;
      min-width: 0;
    }

    .dots {
      position: relative;
      flex-shrink: 0;
      align-self: stretch;
      display: flex;
      align-items: center;
    }

    .dots-btn {
      padding: 8px 12px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .dots-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .dots-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 20;
      min-width: 180px;
      background: #4a6b4a;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
      padding: 6px;
      display: none;
      flex-direction: column;
    }

    .dots-menu.open {
      display: flex;
    }

    .dots-menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      background: none;
      border: none;
      border-radius: 9px;
      color: var(--text);
      font-size: 0.92rem;
      cursor: pointer;
      text-align: left;
    }

    .dots-menu button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .dots-menu .act-delete {
      color: #ff9e9e;
    }

    .dots-menu .act-delete:hover {
      background: rgba(255, 0, 0, 0.15);
    }

    /* ===== Modal tambah/edit ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(135deg, #5d825d, #4a6b4a);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 26px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .modal label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin: 14px 0 6px;
    }

    .modal .input-field {
      margin-bottom: 0;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .modal-btn:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .modal-btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        align-items: stretch;
      }

      .phone {
        width: 100%;
        height: 100vh;
        min-height: 0;
        border-radius: 0;
        padding: 0;
        border: none;
        box-shadow: none;
      }

      .screen {
        border-radius: 0;
        min-height: 100vh;
      }

      .screen-content {
        padding: 12px 16px 22px;
      }

      .name { font-size: 1.35rem; }
      .avatar { width: 92px; height: 92px; font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="statusbar">
        <span>9:41</span>
        <div class="notch"></div>
        <span>🔋 ▮</span>
      </div>
      <div class="screen-content">
        <!-- Halaman Login -->
        <div id="login" class="container" hidden>
    <div class="login-card">
      <span class="lock-icon">🔒</span>
      <h2>Masuk</h2>
      <p class="sub">Masukkan username dan password untuk melihat tautan.</p>
      <form id="login-form" novalidate>
        <div id="login-error" class="error">Username atau password salah.</div>
        <input id="username" class="input-field" type="text" placeholder="Username" autocomplete="username" required>
        <div class="password-wrap">
          <input id="password" class="input-field" type="password" placeholder="Password" autocomplete="current-password" required>
          <button id="toggle-pass" class="toggle-pass" type="button" aria-label="Lihat password">👁</button>
        </div>
        <button class="btn" type="submit">Masuk</button>
      </form>
    </div>
  </div>

  <!-- Isi Linktree -->
  <div id="content" class="container" hidden>
    <!-- Ganti dengan foto: <img class="avatar" src="foto.jpg"> -->
    <img id="display-avatar" class="avatar" src="meimei.jpg" alt="Jocelyn Patricia">

    <header class="profile">

    </header>

    <main id="links" class="links"></main>

    <footer class="footer">
      <span id="display-footer">© 2026 Jocelyn Patricia</span>
      <button id="logout-btn" class="logout-btn" type="button">Keluar</button>
    </footer>
    </div>
      </div>
    </div>
  </div>

  <div id="link-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="modal-title">Tambah Tautan</h2>
      <label for="m-label">Label</label>
      <input id="m-label" class="input-field" type="text" placeholder="Nama tautan">
      <label for="m-url">URL</label>
      <input id="m-url" class="input-field" type="url" placeholder="https://...">
      <label for="m-icon">Ikon (emoji)</label>
      <input id="m-icon" class="input-field" type="text" placeholder="🌐">
      <div class="modal-actions">
        <button id="m-cancel" class="modal-btn" type="button">Batal</button>
        <button id="m-save" class="modal-btn primary" type="button">Simpan</button>
      </div>
    </div>
  </div>

  <script>
var USERNAME = "Jocelyn";
    var PASSWORD = "Patricia";
    var SESSION_KEY = "linktree_logged_in";

    var loginView = document.getElementById("login");
    var contentView = document.getElementById("content");
    var loginForm = document.getElementById("login-form");
    var errorBox = document.getElementById("login-error");

    function showContent() {
      loginView.hidden = true;
      contentView.hidden = false;
    }

    function showLogin() {
      contentView.hidden = true;
      loginView.hidden = false;
    }

    if (sessionStorage.getItem(SESSION_KEY) === "1") {
      showContent();
    } else {
      showLogin();
    }

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var u = document.getElementById("username").value.trim();
      var p = document.getElementById("password").value;

      if (u === USERNAME && p === PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, "1");
        errorBox.style.display = "none";
        showContent();
      } else {
        errorBox.style.display = "block";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", function () {
      sessionStorage.removeItem(SESSION_KEY);
      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
      errorBox.style.display = "none";
      showLogin();
    });

    document.getElementById("toggle-pass").addEventListener("click", function () {
      var input = document.getElementById("password");
      if (input.type === "password") {
        input.type = "text";
        this.textContent = "🙈";
      } else {
        input.type = "password";
        this.textContent = "👁";
      }
    });

    // ===== Kelola tautan (tambah / edit / hapus) =====
    var LINKS_KEY = "linktree_links";
    var DEFAULT_LINKS = [
      { label: "Website / Portofolio", url: "https://example.com/", icon: "🌐" },
      { label: "Instagram", url: "https://instagram.com/", icon: "📸" },
      { label: "Video Terbaru", url: "https://youtube.com/", icon: "🎥" },
      { label: "Layanan / Jasa", url: "https://example.com/layanan/", icon: "💼" },
      { label: "CV / Resume", url: "https://example.com/cv.pdf", icon: "📄" },
      { label: "Email Saya", url: "mailto:email@example.com", icon: "📧" }
    ];

    var links = null;
    try {
      var saved = localStorage.getItem(LINKS_KEY);
      links = saved ? JSON.parse(saved) : null;
    } catch (e) { links = null; }
    if (!links || !links.length) links = JSON.parse(JSON.stringify(DEFAULT_LINKS));

    var linksView = document.getElementById("links");
    var linkModal = document.getElementById("link-modal");
    var modalTitle = document.getElementById("modal-title");
    var mLabel = document.getElementById("m-label");
    var mUrl = document.getElementById("m-url");
    var mIcon = document.getElementById("m-icon");
    var editingIndex = -1;

    function saveLinks() {
      localStorage.setItem(LINKS_KEY, JSON.stringify(links));
    }

    function renderLinks() {
      linksView.innerHTML = "";
      links.forEach(function (item, i) {
        var card = document.createElement("div");
        card.className = "link-card";

        var row = document.createElement("div");
        row.className = "link-row";

        var a = document.createElement("a");
        a.className = "link";
        a.href = item.url || "#";
        if (/^https?:/i.test(item.url)) {
          a.target = "_blank";
          a.rel = "noopener";
        }

        var icon = document.createElement("span");
        icon.className = "icon";
        icon.textContent = item.icon || "🔗";

        var label = document.createElement("span");
        label.className = "label";
        label.textContent = item.label;

        var arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "→";

        a.appendChild(icon);
        a.appendChild(label);
        a.appendChild(arrow);

        var dots = document.createElement("div");
        dots.className = "dots";

        var dotsBtn = document.createElement("button");
        dotsBtn.className = "dots-btn";
        dotsBtn.type = "button";
        dotsBtn.setAttribute("aria-label", "Menu");
        dotsBtn.textContent = "⋮";

        var menu = document.createElement("div");
        menu.className = "dots-menu";
        menu.setAttribute("data-index", String(i));
        menu.innerHTML =
          '<button type="button" data-act="edit">✏️ Edit</button>' +
          '<button type="button" data-act="add">➕ Tambah</button>' +
          '<button type="button" data-act="delete" class="act-delete">🗑️ Hapus</button>';

        dots.appendChild(dotsBtn);
        dots.appendChild(menu);
        row.appendChild(a);
        row.appendChild(dots);
        card.appendChild(row);
        linksView.appendChild(card);
      });
    }

    function closeAllMenus() {
      var menus = linksView.querySelectorAll(".dots-menu.open");
      for (var j = 0; j < menus.length; j++) {
        menus[j].classList.remove("open");
      }
    }

    function openModal(title, index) {
      editingIndex = index;
      modalTitle.textContent = title;
      if (index >= 0) {
        mLabel.value = links[index].label;
        mUrl.value = links[index].url;
        mIcon.value = links[index].icon || "";
      } else {
        mLabel.value = "";
        mUrl.value = "";
        mIcon.value = "";
      }
      linkModal.hidden = false;
      mLabel.focus();
    }

    function closeModal() {
      linkModal.hidden = true;
      editingIndex = -1;
    }

    function saveCurrentModal() {
      var label = mLabel.value.trim();
      var url = mUrl.value.trim();
      var icon = mIcon.value.trim() || "🔗";
      if (!label || !url) {
        alert("Label dan URL wajib diisi.");
        return;
      }
      var item = { label: label, url: url, icon: icon };
      if (editingIndex >= 0) {
        links[editingIndex] = item;
      } else {
        links.push(item);
      }
      saveLinks();
      renderLinks();
      closeModal();
    }

    linksView.addEventListener("click", function (e) {
      var dotsBtn = e.target.closest(".dots-btn");
      if (dotsBtn) {
        openMenu(dotsBtn.parentElement);
        return;
      }
      var actBtn = e.target.closest("[data-act]");
      if (actBtn) {
        var menuEl = actBtn.closest(".dots-menu");
        var index = parseInt(menuEl.getAttribute("data-index"), 10);
        var act = actBtn.getAttribute("data-act");
        closeAllMenus();
        if (act === "edit") {
          openModal("Edit Tautan", index);
        } else if (act === "add") {
          openModal("Tambah Tautan", -1);
        } else if (act === "delete") {
          if (confirm('Hapus tautan "' + links[index].label + '"?')) {
            links.splice(index, 1);
            saveLinks();
            renderLinks();
          }
        }
      }
    });

    function openMenu(container) {
      var menu = container.querySelector(".dots-menu");
      var wasOpen = menu.classList.contains("open");
      closeAllMenus();
      if (!wasOpen) menu.classList.add("open");
    }

    document.addEventListener("click", function (e) {
      if (!e.target.closest(".dots")) closeAllMenus();
    });

    linkModal.addEventListener("click", function (e) {
      if (e.target === linkModal) closeModal();
    });

    document.getElementById("m-cancel").addEventListener("click", closeModal);
    document.getElementById("m-save").addEventListener("click", saveCurrentModal);

    linkModal.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeModal();
    });

    renderLinks();
  </script>
</body>
</html>
